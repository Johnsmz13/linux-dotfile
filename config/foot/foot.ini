# ~/.config/foot/foot.ini

# Window / Padding
# Alacritty: padding = { x = 6, y = 6 }
pad=6x6

# Font
# Alacritty: size = 12.0, family = "Fira Code", style = "Medium"
# Note: foot font syntax is family:style=StyleName:size=N
font=Fira Code:style=Medium:size=12

# Window Decorations
# Alacritty: decorations = "None"
# foot uses CSD settings. "none" requests no client-side decorations.
# Actual behavior depends on your Wayland compositor.
[csd]
preferred=none

# Colors (Dark Theme)
[colors]
# Primary
background=080808
foreground=ffffff

# Cursor
# Alacritty: text = '#dc38ce', cursor = '#ffffff'
cursor=dc38ce ffffff

# Normal Colors (regular0-7)
regular0=000000
regular1=d92626
regular2=4ad926
regular3=d9d926
regular4=266ed9
regular5=b526d9
regular6=26d9d9
regular7=d0d0d0

# Bright Colors (bright0-7)
bright0=808080
bright1=d92626
bright2=4ad926
bright3=d9d926
bright4=266ed9
bright5=b526d9
bright6=26d9d9
bright7=ffffff
