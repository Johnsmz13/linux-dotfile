# /etc/portage/make.conf
# ThinkPad X1 Carbon Gen 9 - Intel Tiger Lake-U (11th Gen Core i5)

# ---------------------------------------------------------------------------
# Compiler & CPU
# ---------------------------------------------------------------------------
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=native"

# ---------------------------------------------------------------------------
# Parallelism (4 cores / 8 threads)
# Suitable for a 16 GB RAM configuration while leaving some headroom
# ---------------------------------------------------------------------------
MAKEOPTS="-j6 -l8"
EMERGE_DEFAULT_OPTS="--ask --verbose --with-bdeps=y --binpkg-respect-use=y"

# ---------------------------------------------------------------------------
# Portage features
# ---------------------------------------------------------------------------
FEATURES="${FEATURES} buildpkg parallel-fetch"
PKGDIR="/var/cache/binpkgs"

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
VIDEO_CARDS="intel"                     # Tiger Lake / Intel Iris Xe (Gen12)
INPUT_DEVICES="libinput"                # touchpad, TrackPoint, keyboard

# UEFI system
GRUB_PLATFORMS="efi-64"

# ---------------------------------------------------------------------------
# USE flags - Wayland + OpenRC + NetworkManager
# ---------------------------------------------------------------------------
USE="wayland networkmanager dbus elogind \
     alsa pipewire \
     bluetooth wifi \
     vaapi \
     -systemd \
     -X"

# ---------------------------------------------------------------------------
# Licenses & locale
# ---------------------------------------------------------------------------
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
LC_MESSAGES=C.UTF-8
